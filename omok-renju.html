<style>
:root{--bg:#D5DFD4;--ink:#1D2A25;--muted:#56665E;--panel:#EDF1EA;--edge:#A9B9AE;--accent:#2E5B4E;--forb:#B3261E;--wood:#DDAE62;--wood2:#C7934A;--grid:#3A2912;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17211D;--ink:#E4EBE5;--muted:#98A89F;--panel:#202C27;--edge:#37483F;--accent:#86BFAB;--forb:#E0574D;--wood:#C99A52;--wood2:#B0803C;--grid:#2A1C0A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17211D;--ink:#E4EBE5;--muted:#98A89F;--panel:#202C27;--edge:#37483F;--accent:#86BFAB;--forb:#E0574D;--wood:#C99A52;--wood2:#B0803C;--grid:#2A1C0A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 6px;max-width:760px;width:100%;margin:0 auto}

.players{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;padding:4px 16px}
.pl{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:2px solid transparent;color:var(--muted);transition:border-color .2s,color .2s}
.pl.on{border-color:var(--accent);color:var(--ink);background:var(--panel)}

.clk .ch{letter-spacing:1px;font-size:.7rem;color:var(--accent)}
.clk .ch s{text-decoration:none;color:var(--forb);opacity:.5}
.clk.warn .sec{color:var(--forb)}
.tbar{height:4px;border-radius:2px;background:var(--edge);overflow:hidden;max-width:728px;width:calc(100% - 32px);margin:2px auto 0}

main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 12px}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:6px;box-shadow:0 2px 0 var(--wood2),0 10px 24px #0003;touch-action:manipulation;cursor:pointer}
footer{display:flex;gap:10px;justify-content:center;padding:6px 16px 14px}
button{font:inherit;font-weight:600;font-size:1rem;color:var(--ink);background:var(--panel);border:1.5px solid var(--edge);border-radius:12px;padding:10px 18px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:disabled{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);background:var(--forb);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.card{background:var(--panel);border-radius:18px;padding:24px;max-width:380px;width:100%;max-height:90%;overflow:auto;text-align:center}
.card h2{font-family:"Gowun Batang",serif;font-size:2rem;margin:.2em 0}

.set{text-align:left}
.set h3{font-family:"Gowun Batang",serif;font-size:1.3rem;margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--edge)}
.row div small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.seg{display:flex;border:1.5px solid var(--edge);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 10px;font-size:.85rem;background:transparent}

input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.sub{opacity:1;transition:opacity .2s}.sub.off{opacity:.35;pointer-events:none}
.acts{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.legend{font-size:.78rem;color:var(--muted);text-align:center;padding:0 16px}
.legend b{color:var(--forb)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

  <h3>⚙️ 설정</h3>

  <div class="row"><div>흑 금수<small>흑은 3·3, 4·4, 장목(6목 이상) 금지</small></div><input type="checkbox" id="cRenju"></div>
  <div class="row sub" id="rShow"><div>금수 자리 표시<small>흑 차례에 둘 수 없는 곳을 ✕로 표시</small></div><input type="checkbox" id="cShow"></div>
  <div class="row"><div>백 장목 승리 인정<small>끄면 백도 정확히 5목만 승리</small></div><input type="checkbox" id="cWOver"></div>
  <div class="row"><div>🤖 AI와 대전<small>끄면 한 태블릿에서 둘이 번갈아 둬요</small></div><input type="checkbox" id="cAI"></div>
  <div class="row sub" id="rColor"><div>내 돌 색</div><div class="seg" data-k="human"><button data-v="1">흑 (선공)</button><button data-v="2">백 (후공)</button></div></div>
  <div class="row sub" id="rLv"><div>AI 난이도</div><div class="seg" data-k="level"><button data-v="0">쉬움</button><button data-v="1">중간</button><button data-v="2">어려움</button></div></div>
  <div class="acts"><button id="bReset">승수 초기화</button><button class="primary" id="bClose">닫기</button></div>
  <p style="font-size:.78rem;text-align:left;margin:12px 0 0">판 크기, 규칙, AI 대전, 돌 색을 바꾸면 새 판이 시작돼요.</p>
</div></div>
<script id="engsrc" type="text/plain">
const E = (() => {
  const D = [[1,0],[0,1],[1,1],[1,-1]];
  const st = { N: 15, B: new Int8Array(225), renju: true, whiteOver: true };
  const at = (x,y) => (x<0||y<0||x>=st.N||y>=st.N) ? -1 : st.B[y*st.N+x];
  const put = (x,y,v) => { st.B[y*st.N+x] = v; };
  function reset(N){ st.N=N; st.B=new Int8Array(N*N); }
  function run(x,y,dx,dy,c){ let f=0,b=0; while(at(x+dx*(f+1),y+dy*(f+1))===c) f++; while(at(x-dx*(b+1),y-dy*(b+1))===c) b++; return [b,f]; }
  // ---------- 렌주 금수 ----------
  function fourCount(x,y,dx,dy){
    const pts=[];
    for(let k=-4;k<=4;k++){ if(!k) continue; const qx=x+dx*k, qy=y+dy*k;
      if(at(qx,qy)!==0) continue; put(qx,qy,1); const [b,f]=run(x,y,dx,dy,1); if(b+f+1===5) pts.push(k); put(qx,qy,0); }
    if(!pts.length) return 0; if(pts.length===1) return 1;
    if(pts.length===2 && Math.abs(pts[0]-pts[1])===5) return 1;
    return 2;
  }
  function straightFour(x,y,dx,dy){
    const [b,f]=run(x,y,dx,dy,1); if(b+f+1!==4) return false;
    if(at(x-dx*(b+1),y-dy*(b+1))!==0 || at(x+dx*(f+1),y+dy*(f+1))!==0) return false;
    if(at(x-dx*(b+2),y-dy*(b+2))===1 || at(x+dx*(f+2),y+dy*(f+2))===1) return false;
    return true;
  }
  function openThree(x,y,dx,dy,depth){
    for(let k=-4;k<=4;k++){ if(!k) continue; const qx=x+dx*k, qy=y+dy*k;
      if(at(qx,qy)!==0) continue; put(qx,qy,1); const sf=straightFour(x,y,dx,dy); put(qx,qy,0);
      if(sf && !forbidden(qx,qy,depth+1)) return true; }
    return false;
  }
  function forbidden(x,y,depth=0){
    if(at(x,y)!==0 || depth>3) return null;
    put(x,y,1); let five=false, over=false;
    for(const [dx,dy] of D){ const [b,f]=run(x,y,dx,dy,1); const n=b+f+1; if(n===5) five=true; else if(n>5) over=true; }
    let res=null;
    if(!five){
      if(over) res='장목';
      else { const fd=D.map(([dx,dy])=>fourCount(x,y,dx,dy)); const fours=fd[0]+fd[1]+fd[2]+fd[3];
        if(fours>=2) res='4·4';
        else { let t=0; for(let i=0;i<4&&t<2;i++){ if(!fd[i] && openThree(x,y,D[i][0],D[i][1],depth)) t++; } if(t>=2) res='3·3'; } }
    }
    put(x,y,0); return res;
  }
  const exactFor = c => (c===1&&st.renju)||(c===2&&!st.whiteOver);
  function winLine(x,y,c){
    for(const [dx,dy] of D){ const [b,f]=run(x,y,dx,dy,c); const n=b+f+1;
      if(n>=5 && (!exactFor(c)||n===5)){ const L=[]; for(let k=-b;k<=f;k++) L.push([x+dx*k,y+dy*k]); return L; } }
    return null;
  }
  // ---------- 모양 점수표 (9칸 줄 → 점수) ----------
  const TIERS=[
    [1e5,['011110']],
    [1e4,['11110','01111','10111','11011','11101']],
    [3000,['001110','011100','010110','011010']],
    [400,['01110','11100','00111','11010','01011','10110','01101','10011','11001','10101']],
    [120,['00110','01100','01010','010010']],
    [20,['11000','00011','10100','00101','0110','1001']],
  ];
  function hits(s,p){ let i=s.indexOf(p); while(i>=0){ if(i<=4&&4<i+p.length) return true; i=s.indexOf(p,i+1);} return false; }
  const LS=new Int32Array(6561), LF=new Uint8Array(6561); // LF: 1=5목, 2=6목 이상
  for(let code=0;code<6561;code++){
    let s='', t=code; const dg=[]; for(let i=0;i<8;i++){ dg.unshift(t%3); t=(t/3)|0; }
    for(let i=0;i<8;i++){ if(i===4) s+='1'; s+= dg[i]===1?'1':dg[i]===0?'0':'2'; }
    const six=hits(s,'111111'), five=hits(s,'11111');
    LF[code]= six?2:five?1:0;
    let v=0; for(const [sc,ps] of TIERS){ if(ps.some(p=>hits(s,p))){ v=sc; break; } } LS[code]=v;
  }
  function code(x,y,dx,dy,c){ let k=0;
    for(let i=-4;i<=4;i++){ if(!i) continue; const v=at(x+dx*i,y+dy*i); k=k*3+(v===c?1:v===0?0:2); } return k; }
  function pointScore(x,y,c){
    const ex=exactFor(c); let tot=0,fours=0,threes=0,five=false,over=false;
    for(let d=0;d<4;d++){ const k=code(x,y,D[d][0],D[d][1],c); const f=LF[k];
      if(f===1 || (f===2&&!ex)){ five=true; continue; }
      if(f===2) over=true;
      const v=LS[k]; if(v>=1e4) fours++; else if(v===3000) threes++; tot+=v; }
    if(five) return 1e6;
    if(c===1&&st.renju&&(over||fours+threes>=2) && forbidden(x,y,1)) return -1;
    if(fours>=2||(fours&&threes)) tot+=5e4; else if(threes>=2) tot+=2e4;
    return tot;
  }
  function makesFive(x,y,c){ // (x,y) 빈칸에 c를 두면 5목인가
    const ex=exactFor(c);
    for(const [dx,dy] of D){ let f=0,b=0; while(at(x+dx*(f+1),y+dy*(f+1))===c) f++; while(at(x-dx*(b+1),y-dy*(b+1))===c) b++;
      const n=b+f+1; if(n===5||(n>5&&!ex)) return true; }
    return false;
  }
  function cands(r=2){
    const N=st.N, seen=new Uint8Array(N*N), out=[]; let any=false;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(!st.B[y*N+x]) continue; any=true;
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){ const X=x+dx,Y=y+dy; if(at(X,Y)===0&&!seen[Y*N+X]){seen[Y*N+X]=1;out.push([X,Y]);} } }
    if(!any) out.push([N>>1,N>>1]);
    return out;
  }
  // 5를 완성하는 빈 칸 목록 (c 관점)
  function fivePoints(c, near){
    const out=[]; const N=st.N;
    if(near){ const [x,y]=near; const seen=new Set();
      for(const [dx,dy] of D) for(let k=-4;k<=4;k++){ if(!k) continue; const X=x+dx*k,Y=y+dy*k;
        if(at(X,Y)===0 && !seen.has(Y*N+X)){ seen.add(Y*N+X); if(makesFive(X,Y,c)) out.push([X,Y]); } }
      return out; }
    for(const [X,Y] of cands(1)) if(makesFive(X,Y,c)) out.push([X,Y]);
    return out;
  }
  function legal(x,y,c){ return !(c===1&&st.renju&&forbidden(x,y)); }
  function rank(c){
    const out=[];
    for(const [x,y] of cands()){ const a=pointScore(x,y,c); if(a<0) continue; let d=pointScore(x,y,3-c); if(d<0) d=0; out.push({x,y,a,d,s:a+d*0.9}); }
    return out.sort((p,q)=>q.s-p.s);
  }
  // ---------- VCF: 연속 4로 이기는 수순 찾기 ----------
  let deadline=Infinity, nodes=0;
  function vcf(c, depth){
    if(depth<=0 || Date.now()>deadline) return null;
    const o=3-c;
    for(const m of cands(1)){
      const [x,y]=m; if(pointScore(x,y,c) < 1e4) continue;           // 4를 만들지 못하면 제외
      if(c===1&&st.renju&&forbidden(x,y)) continue;
      put(x,y,c); nodes++;
      const w=fivePoints(c,[x,y]);
      let ok=null;
      if(w.length>=2) ok=[[x,y]];
      else if(w.length===1){
        const [rx,ry]=w[0];
        if(o===1&&st.renju&&forbidden(rx,ry)) ok=[[x,y]];            // 흑이 금수라 못 막음
        else { put(rx,ry,o);
          const oppFive = makesFiveAny(o,[rx,ry]);
          if(!oppFive){ const sub=vcf(c,depth-1); if(sub) ok=[[x,y],...sub]; }
          put(rx,ry,0); }
      }
      put(x,y,0);
      if(ok) return ok;
    }
    return null;
  }
  function makesFiveAny(c,near){ return fivePoints(c,near).length>0; }
  // ---------- 알파베타 ----------
  const WIN=1e8;
  function evalSide(c){ // 둘 차례 c 관점
    let ma=0,md=0; for(const [x,y] of cands(2)){ const a=pointScore(x,y,c); const d=pointScore(x,y,3-c); if(a>ma)ma=a; if(d>md)md=d; }
    return ma*1.2-md;
  }
  function moves(c,K){
    const o=3-c;
    const myFive=fivePoints(c); const legalFive=myFive.filter(([x,y])=>legal(x,y,c));
    if(legalFive.length) return {win:legalFive[0]};
    const opFive=fivePoints(o).filter(([x,y])=>legal(x,y,o));
    const r=rank(c);
    if(opFive.length){ const set=new Set(opFive.map(([x,y])=>x+','+y));
      const blk=r.filter(m=>set.has(m.x+','+m.y)); return {list:blk, lose: opFive.length>=2&&blk.length<=1 ? true:false}; }
    return {list:r.slice(0,K)};
  }
  function ab(c,depth,alpha,beta,K){
    nodes++;
    const mv=moves(c,K);
    if(mv.win) return WIN+depth;
    if(!mv.list.length) return -WIN;
    if(depth===0) return evalSide(c);
    if(Date.now()>deadline) throw 'T';
    let best=-Infinity;
    for(const m of mv.list){ put(m.x,m.y,c); let v;
      try{ v=-ab(3-c,depth-1,-beta,-alpha,K); } finally { put(m.x,m.y,0); }
      if(v>best) best=v; if(best>alpha) alpha=best; if(alpha>=beta) break; }
    return best;
  }
  function think(c,ms,maxDepth,K){
    deadline=Date.now()+ms; nodes=0; const o=3-c;
    const mv=moves(c,K+4);
    if(mv.win) return {x:mv.win[0],y:mv.win[1],why:'win'};
    let list=mv.list; if(!list.length) return null;
    if(list.length===1) return list[0];
    // 1) 내 VCF
    if(!fivePoints(o).length){ const seq=vcf(c,12); if(seq) return {x:seq[0][0],y:seq[0][1],why:'vcf'}; }
    // 2) 상대 VCF를 허용하는 수 거르기
    deadline=Date.now()+ms;
    const safe=[];
    for(const m of list){ put(m.x,m.y,c); const t=vcf(o,10); put(m.x,m.y,0); if(!t) safe.push(m); if(Date.now()>deadline-ms*0.5) break; }
    if(safe.length) list=safe;
    // 3) 반복 심화 알파베타
    let bestM=list[0];
    for(let d=2; d<=maxDepth; d+=1){
      let alpha=-Infinity, cur=null, curV=-Infinity;
      try{
        for(const m of list){ put(m.x,m.y,c); let v; try{ v=-ab(o,d-1,-Infinity,-alpha,K); } finally{ put(m.x,m.y,0); }
          if(v>curV){curV=v;cur=m;} if(v>alpha) alpha=v; }
      }catch(e){ if(e==='T') break; throw e; }
      if(cur){ bestM=cur; list=[cur,...list.filter(m=>m!==cur)]; }
      if(curV>=WIN) break;
    }
    return bestM;
  }
  function aiMove(c,level){
    let r=rank(c); if(c===1&&st.renju) r=r.filter(m=>!forbidden(m.x,m.y));
    if(!r.length) return null;
    const o=3-c;
    if(level===0){ // 쉬움: 5는 거의 두고, 막기는 가끔 놓침
      const w=fivePoints(c).find(([x,y])=>legal(x,y,c)); if(w&&Math.random()<.85) return {x:w[0],y:w[1]};
      const b=fivePoints(o).find(([x,y])=>legal(x,y,c)); if(b&&Math.random()<.75) return {x:b[0],y:b[1]};
      return r[Math.floor(Math.random()**1.6*Math.min(8,r.length))];
    }
    if(level===1){ const m=think(c,400,3,8); return m||r[0]; }
    const m=think(c,1800,10,9); return m||r[0];
  }
  return { st, at, put, reset, forbidden, winLine, aiMove, pointScore, rank };
})();
if (typeof module!=='undefined') module.exports=E;

</script>
<script>
// ---- 엔진 (브라우저/노드 공용) ----
const E=new Function(document.getElementById('engsrc').textContent+';return E;')();

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg=Object.assign({size:15,renju:true,show:true,whiteOver:true,ai:false,human:1,level:1,limit:20},store.get('omokR2.cfg',{}));
if(cfg.level>2)cfg.level=2;
let score=Object.assign({me:0,ai:0,b:0,w:0},store.get('omokR.score',{}));
let moves=[],turn=1,over=false,win=null,thinking=false,forb=new Map(),hover=null,gen=0;

function applyCfg(){E.st.renju=cfg.renju;E.st.whiteOver=cfg.whiteOver;}
function newGame(){strikes={1:0,2:0};if(thinking&&worker){worker.terminate();pend.clear();worker=mkWorker();}gen++;applyCfg();E.reset(cfg.size);moves=[];turn=1;over=false;win=null;thinking=false;hover=null;refresh();maybeAI();}
const aiTurn=()=>cfg.ai&&turn!==cfg.human;
function calcForb(){forb.clear();if(!cfg.renju||over||turn!==1||aiTurn())return;const N=cfg.size;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=E.forbidden(x,y);if(f)forb.set(y*N+x,f);}}
function refresh(){
  calcForb();
  $('pB').classList.toggle('on',!over&&turn===1);$('pW').classList.toggle('on',!over&&turn===2);
  const think=thinking?'생각 중…':'';
  $('nB').textContent=cfg.ai?(cfg.human===1?'나':'AI '+(turn===1?think:'')):(turn===1&&!over?'차례':'');
  $('nW').textContent=cfg.ai?(cfg.human===2?'나':'AI '+(turn===2?think:'')):(turn===2&&!over?'차례':'');
  if(cfg.ai){$('sL').textContent='나';$('sR').textContent='AI';$('sA').textContent=score.me;$('sB').textContent=score.ai;}
  else{$('sL').textContent='흑';$('sR').textContent='백';$('sA').textContent=score.b;$('sB').textContent=score.w;}
  $('legend').style.visibility=cfg.renju?'visible':'hidden';
  $('bUndo').disabled=thinking||over||!moves.length||(cfg.ai&&!moves.some(m=>m.c===cfg.human));
  syncClock();
  draw();
}
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1400);}

const MAXS=3;let strikes={1:0,2:0},clkKey='',deadline=0,pausedAt=0,clkT=null;
function clockOn(){return cfg.limit>0&&!over&&!thinking&&!aiTurn();}
function syncClock(){
  const key=gen+'|'+moves.length+'|'+turn+'|'+over+'|'+thinking;
  if(key!==clkKey){clkKey=key;deadline=Date.now()+cfg.limit*1000;}
  if(!clkT)clkT=setInterval(tick,200);
  paintClock();
}
function tick(){
  if(!cfg.limit)return paintClock();
  const paused=$('mSet').classList.contains('show')||$('mEnd').classList.contains('show')||document.hidden;
  if(paused){if(!pausedAt)pausedAt=Date.now();return;}
  if(pausedAt){deadline+=Date.now()-pausedAt;pausedAt=0;}
  if(clockOn()&&Date.now()>=deadline){
    strikes[turn]++;
    if(strikes[turn]>=MAXS){over=true;const w=3-turn;finish(w,'time');refresh();return;}
    toast('시간 초과! 남은 기회 '+(MAXS-strikes[turn])+'번');deadline=Date.now()+cfg.limit*1000;
  }
  paintClock();
}
function paintClock(){
  const on=cfg.limit>0;$('tbar').style.visibility=on?'visible':'hidden';
  const rem=Math.max(0,deadline-Date.now()),sec=Math.ceil(rem/1000),active=clockOn();
  const warn=active&&sec<=5;
  $('tfill').style.transform='scaleX('+(active?rem/(cfg.limit*1000):0)+')';$('tbar').classList.toggle('warn',warn);
  for(const c of [1,2]){const el=$(c===1?'kB':'kW');
    const human=!cfg.ai||cfg.human===c;
    if(!on||!human){el.innerHTML='';continue;}
    const left=MAXS-strikes[c];
    el.innerHTML=(active&&turn===c?'<span class="sec">'+sec+'</span>':'')+'<span class="ch" title="남은 기회">'+'●'.repeat(left)+'<s>'+'●'.repeat(MAXS-left)+'</s></span>';
    el.classList.toggle('warn',warn&&turn===c);}
}
function place(x,y){
  const c=turn;
  if(c===1&&cfg.renju){const f=E.forbidden(x,y);if(f){toast('금수: '+f+' 자리예요');return false;}}
  E.put(x,y,c);moves.push({x,y,c});
  const L=E.winLine(x,y,c);
  if(L){over=true;win=L;finish(c);}
  else if(moves.length===cfg.size*cfg.size){over=true;finish(0);}
  else turn=3-c;
  refresh();return true;
}
function finish(c,why){
  let t,p;
  if(!c){t='무승부!';p='빈 칸이 모두 채워졌어요.';}
  else if(cfg.ai){const meWin=c===cfg.human;meWin?score.me++:score.ai++;t=meWin?'승리!':'패배';p=meWin?'AI를 이겼어요.':'AI가 5목을 먼저 만들었어요.';}
  else{c===1?score.b++:score.w++;t=(c===1?'흑':'백')+' 승리!';p='5목 완성!';}
  if(why==='time')p=(c===1?'백':'흑')+'이 초읽기를 3번 넘겼어요.';
  store.set('omokR.score',score);
  $('eT').textContent=t;$('eP').textContent=p;
  setTimeout(()=>$('mEnd').classList.add('show'),650);
}
let worker=null,wid=0;const pend=new Map();
function mkWorker(){try{const src=document.getElementById('engsrc').textContent+`
onmessage=e=>{const d=e.data;E.st.renju=d.renju;E.st.whiteOver=d.whiteOver;E.reset(d.N);E.st.B.set(d.B);
let m=null;try{m=E.aiMove(d.c,d.level);}catch(err){}postMessage({id:d.id,m:m&&{x:m.x,y:m.y}});};`;
  const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  w.onmessage=e=>{const r=pend.get(e.data.id);if(r){pend.delete(e.data.id);r(e.data.m);}};
  w.onerror=()=>{worker=null;for(const [,r] of pend)r('fallback');pend.clear();};return w;}catch(e){return null;}}
worker=mkWorker();
function askAI(c,level){return new Promise(res=>{
  const local=()=>setTimeout(()=>{let m=null;try{m=E.aiMove(c,level);}catch(e){}res(m);},30);
  if(!worker){local();return;}
  const id=++wid;pend.set(id,m=>m==='fallback'?local():res(m));
  worker.postMessage({id,c,level,N:cfg.size,B:E.st.B,renju:cfg.renju,whiteOver:cfg.whiteOver});});}
function maybeAI(){
  if(over||!aiTurn())return;thinking=true;refresh();const g=gen,c=turn,t0=Date.now();
  askAI(c,cfg.level).then(m=>{const wait=Math.max(0,350-(Date.now()-t0));setTimeout(()=>{if(g!==gen)return;thinking=false;
    if(m&&E.at(m.x,m.y)===0){if(!place(m.x,m.y))refresh();}else{over=true;finish(0);refresh();}},wait);});
}
function undo(){
  if(thinking||over||!moves.length)return;
  do{const m=moves.pop();E.put(m.x,m.y,0);turn=m.c;}while(cfg.ai&&moves.length&&turn!==cfg.human);
  refresh();maybeAI();
}

// ---- 그리기 ----
const cv=$('cv'),ctx=cv.getContext('2d');let geo={size:0,pad:0,cell:0};
function resize(){const w=$('wrap');const s=Math.floor(Math.min(w.clientWidth,w.clientHeight));if(s<=0)return;const dpr=window.devicePixelRatio||1;
  cv.style.width=cv.style.height=s+'px';cv.width=cv.height=Math.round(s*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const N=cfg.size;const pad=s/(N+1);geo={size:s,pad,cell:(s-2*pad)/(N-1)};draw();}
new ResizeObserver(resize).observe($('wrap'));
function draw(){
  const {size:s,pad,cell}=geo;if(!s)return;const N=cfg.size;const P=i=>pad+i*cell;
  const g=ctx.createLinearGradient(0,0,s,s);const cs=getComputedStyle(document.documentElement);
  g.addColorStop(0,cs.getPropertyValue('--wood'));g.addColorStop(1,cs.getPropertyValue('--wood2'));
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  ctx.strokeStyle=cs.getPropertyValue('--grid');ctx.lineWidth=Math.max(1,s/600);
  ctx.beginPath();for(let i=0;i<N;i++){ctx.moveTo(P(0),P(i));ctx.lineTo(P(N-1),P(i));ctx.moveTo(P(i),P(0));ctx.lineTo(P(i),P(N-1));}ctx.stroke();
  const stars=N===15?[3,7,11]:[3,6,9];ctx.fillStyle=cs.getPropertyValue('--grid');
  for(const a of stars)for(const b of stars){if(N===13&&(a===6)!==(b===6)&&false)continue;ctx.beginPath();ctx.arc(P(a),P(b),cell*.1,0,7);ctx.fill();}
  const r=cell*.46;
  // 금수 표시
  if(cfg.show&&forb.size){ctx.strokeStyle=cs.getPropertyValue('--forb');ctx.lineWidth=Math.max(2,cell*.09);ctx.lineCap='round';const k=cell*.2;
    for(const i of forb.keys()){const x=P(i%N),y=P((i/N)|0);ctx.beginPath();ctx.moveTo(x-k,y-k);ctx.lineTo(x+k,y+k);ctx.moveTo(x+k,y-k);ctx.lineTo(x-k,y+k);ctx.stroke();}}
  // 돌
  for(const m of moves)stone(P(m.x),P(m.y),r,m.c,1);
  if(hover&&!over&&!thinking&&!aiTurn()&&E.at(hover[0],hover[1])===0&&!forb.has(hover[1]*N+hover[0]))stone(P(hover[0]),P(hover[1]),r,turn,.4);
  const last=moves[moves.length-1];
  if(last){ctx.fillStyle=last.c===1?'#fff':'#111';ctx.beginPath();ctx.arc(P(last.x),P(last.y),r*.22,0,7);ctx.fill();}
  if(win){ctx.strokeStyle='#D23B2F';ctx.lineWidth=cell*.14;ctx.lineCap='round';ctx.globalAlpha=.85;ctx.beginPath();
    ctx.moveTo(P(win[0][0]),P(win[0][1]));const e=win[win.length-1];ctx.lineTo(P(e[0]),P(e[1]));ctx.stroke();ctx.globalAlpha=1;}
}
function stone(x,y,r,c,a){ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(x+r*.08,y+r*.12,r,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  if(c===1){g.addColorStop(0,'#6a6a6a');g.addColorStop(1,'#0c0c0c');}else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#cfcfc8');}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function cellAt(e){const b=cv.getBoundingClientRect();const x=Math.round((e.clientX-b.left-geo.pad)/geo.cell),y=Math.round((e.clientY-b.top-geo.pad)/geo.cell);
  return(x>=0&&y>=0&&x<cfg.size&&y<cfg.size)?[x,y]:null;}
cv.addEventListener('click',e=>{if(over||thinking||aiTurn())return;const p=cellAt(e);if(!p||E.at(p[0],p[1])!==0)return;if(place(p[0],p[1]))maybeAI();});
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const p=cellAt(e);if(String(p)!==String(hover)){hover=p;draw();}});
cv.addEventListener('pointerleave',()=>{hover=null;draw();});

// ---- 설정 ----
function syncSet(){document.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(cfg[sg.dataset.k])===b.dataset.v)));
  $('cRenju').checked=cfg.renju;$('cAI').checked=cfg.ai;$('rColor').classList.toggle('off',!cfg.ai);$('rLv').classList.toggle('off',!cfg.ai);$('cShow').checked=cfg.show;$('cWOver').checked=cfg.whiteOver;
  $('rShow').classList.toggle('off',!cfg.renju);}
let needNew=false;
document.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=sg.dataset.k,v=+b.dataset.v;
  if(cfg[k]===v)return;cfg[k]=v;if(k!=='level')needNew=true;store.set('omokR2.cfg',cfg);syncSet();}));
$('cRenju').onchange=e=>{cfg.renju=e.target.checked;needNew=true;store.set('omokR2.cfg',cfg);syncSet();};
$('cAI').onchange=e=>{cfg.ai=e.target.checked;needNew=true;store.set('omokR2.cfg',cfg);syncSet();};
$('cShow').onchange=e=>{cfg.show=e.target.checked;store.set('omokR2.cfg',cfg);syncSet();draw();};
$('cWOver').onchange=e=>{cfg.whiteOver=e.target.checked;needNew=true;store.set('omokR2.cfg',cfg);syncSet();};
$('bSet').onclick=()=>{needNew=false;syncSet();$('mSet').classList.add('show');};
$('bClose').onclick=()=>{$('mSet').classList.remove('show');if(needNew){newGame();resize();}else refresh();};
$('bReset').onclick=()=>{score={me:0,ai:0,b:0,w:0};store.set('omokR.score',score);refresh();toast('승수를 초기화했어요');};
$('mSet').addEventListener('click',e=>{if(e.target.id==='mSet')$('bClose').click();});
$('bUndo').onclick=undo;$('bNew').onclick=newGame;
$('bNext').onclick=()=>{$('mEnd').classList.remove('show');newGame();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
const ART_URL='https://claude.ai/artifact/4k8riPtCYQUXB33R2ie7u1';
const shareURL=()=>/github\.io$/.test(location.hostname)?location.href.split('#')[0]:ART_URL;
let qrDone=false;
$('bQR').onclick=()=>{const u=shareURL();$('qrU').textContent=u;
  if(!qrDone&&window.QRCode){new QRCode($('qr'),{text:u,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});qrDone=true;}
  else if(!window.QRCode){$('qr').textContent='QR을 만들 수 없어요. 인터넷 연결을 확인하세요.';}
  $('mQR').classList.add('show');};
$('mQR').onclick=()=>$('mQR').classList.remove('show');
newGame();resize();
</script>
